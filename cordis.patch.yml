# dshm-boot-rescue v1.1.0 profile registration（bundle patch）。
#
# 行 id 与包名一致（dshm-boot-rescue）：DSHM 的 .dshm-plugin-rows.yml 用这个 id
# 表达「这个插件启用/停用」，救援插件自身也据此识别「不能停用自己」。
# 合并版仍是纯宿主插件：没有 cordis client 半身、零静态 inject；统一面板由宿主
# 在进程启动后通过 webServer.tapIndex 注入单文件脚本提供。
- insert:
    - id: dshm-boot-rescue
      name: 'dshm-boot-rescue'
